name: Python checks

on:
  workflow_call:

jobs:
  python-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install pixi
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          manifest-path: pyproject.toml
          # Install dependencies according to the lock file if present
          locked: true

      # Lint and test using make targets (which use pixi environment)
      - name: Lint
        run: make lint

      - name: Test
        run: make test
